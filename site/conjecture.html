<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Conjecture — Givework</title>
<meta name="description" content="A conjecture worked in the open on Givework: the statement, the current frontier, and a live feed of every contribution." />
<!-- Served by the Worker at /conjectures/<slug> (content-negotiated: browsers get
     this page, API clients get JSON). The slug comes from the URL path and the
     page renders the same JSON the API serves at this URL. -->

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23161310'/%3E%3Ccircle cx='9' cy='10' r='6' fill='%23E1342B'/%3E%3Crect x='17' y='4' width='12' height='12' fill='%2321449C'/%3E%3Cpolygon points='6,28 16,16 26,28' fill='%23F3C20A'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

<!-- Analytics: config (env-provided token) then the shared PostHog init + CTA tracking. -->
<script src="/analytics-config.js"></script>
<script src="/posthog-init.js"></script>

<link rel="stylesheet" href="/base.css" />
<link rel="stylesheet" href="/persona.css" />
<style>
  /* Conjecture-detail-only styles. */
  .detail { padding: clamp(2.5rem, 6vw, 5rem) 0; }
  .crumb { font-family:'Space Mono',monospace; font-size:.8rem; }
  .crumb a { color: inherit; }
  .head { display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin:.8rem 0 0; }
  .head h1 { margin:0; font-size:clamp(1.7rem, 4.5vw, 2.8rem); letter-spacing:-.02em; }
  .badge { font-family:'Space Mono',monospace; font-size:.75rem; text-transform:uppercase;
           padding:.25rem .6rem; border: var(--line); white-space:nowrap; }
  .badge--open { background: var(--yellow); }
  .badge--settled { background: var(--ink); color: var(--paper); }
  .stmt { font-size:1.15rem; font-weight:300; max-width:64ch; margin:1.2rem 0 .4rem; }
  .mono { font-family:'Space Mono',monospace; }
  /* Reference metadata, parked at the foot of the page rather than interrupting
     the explainer -> significance -> progress flow. */
  .src { font-size:.82rem; opacity:.7; margin:2.6rem 0 0; padding-top:1.2rem;
         border-top:1px solid #16131033; overflow-wrap:anywhere; }
  .src a { color:inherit; text-decoration:underline; }
  .src a:hover { color: var(--red); opacity:1; }
  .formal { font-size:.9rem; margin:.6rem 0 0; overflow-x:auto; }
  .tags { display:flex; flex-wrap:wrap; gap:.4rem; margin:.9rem 0 0; padding:0; list-style:none; }
  .tag { font-family:'Space Mono',monospace; font-size:.7rem; text-transform:uppercase;
         padding:.15rem .5rem; border:2px solid var(--ink); background:#fff; }
  .why { border-left: 6px solid var(--yellow); background:#fff; padding:.9rem 1.1rem;
         margin:1.1rem 0 0; max-width:64ch; }
  .why .k { font-family:'Space Mono',monospace; font-size:.7rem; text-transform:uppercase;
            letter-spacing:.05em; display:block; margin-bottom:.3rem; }
  .why p { margin:0; font-weight:300; }
  .video { margin:2rem 0 0; max-width:64ch; }
  .video .k { font-family:'Space Mono',monospace; font-size:.7rem; text-transform:uppercase;
              letter-spacing:.05em; display:block; margin-bottom:.5rem; opacity:.7; }
  /* aspect-ratio holds the slot at its final height, so filling it after the HEAD
     probe doesn't shove the rest of the page down (layout shift). */
  .video video { width:100%; aspect-ratio:16/9; display:block; border: var(--line);
                 background: var(--ink); }
  .metrics { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap:1rem; margin:2rem 0 0; }
  .metric { border: var(--line); background:#fff; padding:.9rem 1rem; }
  .metric .v { font-family:'Space Mono',monospace; font-size:1.4rem; font-weight:700; display:block; }
  .metric .k { font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; }
  .frontier { margin:2rem 0 0; border: var(--line); background: var(--ink); color: var(--paper);
              padding:1rem 1.2rem; font-family:'Space Mono',monospace; font-size:.82rem; overflow-x:auto; }
  .frontier .k { color: var(--yellow); text-transform:uppercase; font-size:.7rem; display:block; margin-bottom:.4rem; }
  .feed-head { margin:2.6rem 0 0; }
  .feed { list-style:none; margin:.8rem 0 0; padding:0; border-top: var(--line); }
  /* flex-wrap + a shrinkable summary keep the nowrap date from overflowing the
     viewport on narrow screens — it drops to its own line instead. */
  .feed li { border-bottom: 1px solid #16131033; padding:.8rem .2rem; font-weight:300;
             display:flex; gap:.5rem .9rem; align-items:baseline; flex-wrap:wrap; }
  .feed .sum { flex:1 1 16ch; min-width:0; overflow-wrap:anywhere; }
  .tasklist { list-style:none; margin:.8rem 0 0; padding:0; border-top: var(--line); }
  .tasklist li { border-bottom:1px solid #16131033; padding:.75rem .2rem;
                 display:grid; grid-template-columns: 1fr auto; gap:.4rem .9rem;
                 align-items:start; }
  .tasklist .oc { font-family:'Space Mono',monospace; font-size:.7rem; text-transform:uppercase;
                  padding:.1rem .4rem; border:2px solid var(--ink); white-space:nowrap;
                  grid-column:1; grid-row:1; justify-self:start; }
  .tasklist .tk--video { background: var(--blue); color:#fff; border-color: var(--blue); }
  .tasklist .tk--math { background:#fff; }
  .tasklist .tk-main { grid-column:1; grid-row:2; min-width:0; }
  .tasklist .tk-t { font-weight:600; display:block; overflow-wrap:anywhere; }
  .tasklist .tk-a { font-weight:300; opacity:.75; font-size:.9rem; overflow-wrap:anywhere; }
  .tasklist .tk-cap { font-family:'Space Mono',monospace; font-size:.78rem; opacity:.6;
                      white-space:nowrap; grid-column:2; grid-row:1; justify-self:end; }
  .tk-note { font-weight:300; font-size:.9rem; opacity:.85; margin:.9rem 0 0; }
  .tk-note a { color:inherit; }
  .feed .by { font-family:'Space Mono',monospace; font-size:.82em; color:inherit;
              text-decoration:none; border-bottom:2px solid var(--yellow); white-space:nowrap; }
  .feed .by .av { width:1em; height:1em; border-radius:50%; vertical-align:-0.15em;
                  margin-right:.25em; background:var(--ink); }
  .feed .oc { font-family:'Space Mono',monospace; font-size:.7rem; text-transform:uppercase;
              padding:.1rem .4rem; border:2px solid var(--ink); white-space:nowrap; }
  .feed .oc--candidate_solution { background: var(--yellow); }
  /* A claim nobody has confirmed yet: provisional on purpose — dashed, not green. */
  .feed .oc--pending { background: var(--yellow); border-style: dashed; }
  .feed .oc--progress { background: #fff; }
  .feed .oc--dead_end { background: var(--red); color:#fff; border-color: var(--ink); }
  .feed .oc--verified { background: #1e7d46; color:#fff; }
  .feed .oc--accepted { background:#fff; border-color:#1e7d46; color:#1e7d46; }
  .feed .oc--refuted { background: var(--red); color:#fff; }
  .feed .src-code { font-family:'Space Mono',monospace; font-size:.78em; white-space:nowrap;
                    color:inherit; text-decoration:none; border-bottom:2px solid var(--blue);
                    opacity:.85; }
  .feed .src-code:hover { opacity:1; border-color: var(--red); }
  .feed .when { margin-left:auto; font-family:'Space Mono',monospace; font-size:.75rem; opacity:.6; white-space:nowrap; }
  .feed-more { display:flex; gap:.7rem; align-items:center; margin:.9rem 0 0; flex-wrap:wrap; }
  .more-btn { font-family:'Space Mono',monospace; font-size:.72rem; text-transform:uppercase;
              padding:.4rem .9rem; border: var(--line); background:#fff; cursor:pointer; color:inherit; }
  .more-btn:hover:not(:disabled) { background: var(--yellow); }
  .more-btn:disabled { opacity:.55; cursor:default; }
  .more-count { font-family:'Space Mono',monospace; font-size:.72rem; opacity:.6; }
  .board-msg { font-weight:300; }
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="brand" href="/" aria-label="Givework home">
      <svg class="glyph" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" fill="#161310"/>
        <circle cx="11" cy="13" r="7" fill="#e1342b"/>
        <rect x="21" y="6" width="13" height="13" fill="#21449c"/>
        <polygon points="7,34 19,21 31,34" fill="#f3c20a"/>
      </svg>
      <span class="name">Givework</span>
    </a>
    <nav>
      <a class="navlink" href="/">Home</a>
      <a class="navlink" href="/conjectures">All conjectures</a>
      <a class="navlink" href="/tasks">Open work</a>
      <a class="navlink" href="/volunteers">For contributors</a>
      <a class="cta mono" href="mailto:hello@givework.dev?subject=Open%20problem%20proposal">Propose a problem</a>
    </nav>
  </div>
</header>

<main>
  <section class="detail">
    <div class="wrap" id="page">
      <p class="board-msg">Loading…</p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <a class="brand" href="/" aria-label="Givework">
      <svg class="glyph" width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" fill="#161310"/><circle cx="11" cy="13" r="7" fill="#e1342b"/><rect x="21" y="6" width="13" height="13" fill="#21449c"/><polygon points="7,34 19,21 31,34" fill="#f3c20a"/></svg>
      <span class="name" style="font-size:1.1rem">Givework</span>
    </a>
    <span class="mono">Open mathematics · Powered by volunteers</span>
    <span class="mono"><a class="mail" href="mailto:hello@givework.dev">hello@givework.dev</a></span>
  </div>
</footer>

<script>
// Render the conjecture whose slug is the last path segment. The API serves the
// JSON at this same URL; ask for it explicitly so content negotiation picks JSON.
(function () {
  var page = document.getElementById('page');
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var dollars = function (cents) { return '$' + (cents / 100).toFixed(2); };
  var when = function (iso) {
    var d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  };
  var OPEN = { open: 1, partially_resolved: 1 };

  var slug = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  if (!slug || slug === 'conjecture') {
    location.replace('/conjectures');
    return;
  }

  function render(d) {
    document.title = d.name + ' — Givework';
    var settled = !OPEN[d.status];
    var m = d.metrics;
    var h = '<p class="crumb"><a href="/conjectures">← All conjectures</a></p>';
    h += '<div class="head"><h1>' + esc(d.name) + '</h1>' +
      '<span class="badge ' + (settled ? 'badge--settled' : 'badge--open') + '">' +
      esc(d.status.replace('_', ' ')) + '</span></div>';
    h += '<p class="stmt">' + esc(d.statement_plain || 'No plain statement recorded yet.') + '</p>';
    if (d.statement_formal) h += '<p class="mono formal">' + esc(d.statement_formal) + '</p>';
    if (d.tags && d.tags.length) {
      h += '<ul class="tags">' + d.tags.map(function (t) {
        return '<li class="tag">' + esc(t.replace(/-/g, ' ')) + '</li>';
      }).join('') + '</ul>';
    }
    // The explainer comes straight after the claim: it is the fastest way to
    // understand the problem, so it leads rather than trailing the prose. A HEAD
    // probe after render fills this only when the video actually exists, so
    // conjectures without one show nothing at all.
    h += '<div id="cj-video"></div>';
    // …and the significance reads as the caption to it.
    if (d.significance) {
      h += '<div class="why"><span class="k">Why it matters</span><p>' + esc(d.significance) + '</p></div>';
    }
    h += '<div class="metrics">' +
      '<div class="metric"><span class="v">' + m.tasks_open + '/' + m.tasks_total + '</span><span class="k">tasks open</span></div>' +
      '<div class="metric"><span class="v">' + m.contributions + '</span><span class="k">contributions</span></div>' +
      '<div class="metric"><span class="v">' + m.contributors + '</span><span class="k">contributors</span></div>' +
      '<div class="metric"><span class="v">' + dollars(m.compute_cents) + '</span><span class="k">compute donated</span></div>' +
      '</div>';
    if (d.state && Object.keys(d.state).length) {
      h += '<div class="frontier"><span class="k">Current frontier</span>' +
        esc(JSON.stringify(d.state, null, 1)) + '</div>';
    }
    h += '<div id="cj-tasks"></div>';
    h += '<div class="section-head feed-head"><span class="eyebrow">Every attempt, logged</span><h3>Recent contributions.</h3></div>';
    if (d.recent_contributions && d.recent_contributions.length) {
      h += '<ul class="feed" id="cj-feed">' + d.recent_contributions.map(feedRow).join('') + '</ul>';
      // "Every attempt, logged" has to be true: the payload carries only the
      // newest 10, so anything beyond that is paged in on demand rather than
      // silently dropped. Count from metrics, which is the full total.
      if (m.contributions > d.recent_contributions.length) {
        h += '<div class="feed-more">' +
          '<button class="more-btn" id="cj-more" type="button">Load more</button>' +
          '<span class="more-count" id="cj-more-count">' +
          d.recent_contributions.length + ' of ' + m.contributions + '</span></div>';
      }
    } else {
      h += '<p class="board-msg">No contributions yet — be the first to chip away.</p>';
    }
    if (d.source_ref) {
      // External references open in a new tab so the long URL can't hijack the
      // page (and can't overflow the layout as raw text).
      h += /^https?:\/\//.test(d.source_ref)
        ? '<p class="mono src"><a href="' + esc(d.source_ref) + '" target="_blank" rel="noopener noreferrer">' +
          esc(d.source_ref.indexOf('wikipedia.org') !== -1 ? 'Read more on Wikipedia ↗' : 'Source ↗') + '</a></p>'
        : '<p class="mono src">' + esc(d.source_ref) + '</p>';
    }
    page.innerHTML = h;
    maybeAddVideo(slug);
    maybeAddTasks(slug);
    wireMore(slug, m.contributions);
  }

  /** One feed row. Shared by the embedded first page and every paged-in row. */
  function feedRow(r) {
        // The feed is a work ledger, and the badge says only what actually
        // happened. Green "machine-verified" is reserved for a checker-confirmed
        // result; work a human reviewer accepted says just that; a failed check
        // is an honestly-logged refutation. A candidate nothing has confirmed
        // yet reads as pending — never as a result.
        var cls = 'oc--' + r.outcome;
        var label = r.outcome.replace('_', ' ');
        if (r.outcome === 'candidate_solution') {
          if (r.status === 'verified' || r.verdict === 'passed') {
            if (r.verified_via === 'human_review') {
              cls = 'oc--accepted';
              label = 'accepted';
            } else {
              cls = 'oc--verified';
              label = 'machine-verified';
            }
          } else if (r.status === 'rejected' || r.verdict === 'failed') {
            cls = 'oc--refuted';
            label = 'refuted claim';
          } else {
            cls = 'oc--pending';
            label = 'awaiting verification';
          }
        }
        var who = r.contributor
          ? '<a class="by" href="/contributors/' + encodeURIComponent(r.contributor) + '">' +
            '<img class="av" src="https://github.com/' + encodeURIComponent(r.contributor) + '.png?size=48" alt="" loading="lazy" onerror="this.style.display=\'none\'" />' +
            '@' + esc(r.contributor) + '</a> '
          : '';
        // Work-unit contributions cite the exact code that produced them, pinned
        // by commit SHA — click through and you see precisely what ran.
        var code = '';
        if (r.code && r.code.repo && r.code.sha && r.code.entrypoint) {
          var file = r.code.entrypoint.split('/').pop();
          code = ' <a class="src-code" target="_blank" rel="noopener"' +
            ' href="https://github.com/' + esc(r.code.repo) + '/blob/' + esc(r.code.sha) +
            '/' + esc(r.code.entrypoint) + '"' +
            ' title="' + esc(r.code.repo) + ' @ ' + esc(r.code.sha) + '">⌘ ' +
            esc(file) + '@' + esc(r.code.sha.slice(0, 7)) + '</a>';
        }
    return '<li><span class="oc ' + esc(cls) + '">' + esc(label) + '</span>' +
      '<span class="sum">' + who + esc(r.summary || '(no summary)') + code + '</span>' +
      '<span class="when">' + when(r.created_at) + '</span></li>';
  }

  /**
   * "Load more" pages the rest of the feed from /conjectures/:slug/contributions,
   * appending under what is already there. Offset is driven by how many rows we
   * have rendered, so a contribution submitted mid-browse cannot make the walk
   * skip a row — the server orders by id, which is monotonic.
   */
  function wireMore(slug, total) {
    var btn = document.getElementById('cj-more');
    if (!btn) return;
    var feed = document.getElementById('cj-feed');
    var count = document.getElementById('cj-more-count');
    var loading = false;
    btn.addEventListener('click', function () {
      if (loading) return;
      loading = true;
      btn.disabled = true;
      btn.textContent = 'Loading…';
      var offset = feed.children.length;
      fetch('/conjectures/' + encodeURIComponent(slug) + '/contributions?limit=25&offset=' + offset,
            { headers: { accept: 'application/json' }, cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (p) {
          feed.insertAdjacentHTML('beforeend', (p.contributions || []).map(feedRow).join(''));
          count.textContent = feed.children.length + ' of ' + (p.total || total);
          if (p.has_more) {
            btn.disabled = false;
            btn.textContent = 'Load more';
          } else {
            btn.remove(); // nothing left to ask for
          }
          loading = false;
        })
        .catch(function () {
          // Never strand the reader on a dead button: say so and let them retry.
          btn.disabled = false;
          btn.textContent = 'Retry';
          count.textContent = 'Couldn’t load more just now.';
          loading = false;
        });
    });
  }

  // Show the explainer only if /videos/<slug>.mp4 exists (HEAD probe avoids a
  // broken-player flash on conjectures that don't have a video yet).
  function maybeAddVideo(slug) {
    var src = '/videos/' + encodeURIComponent(slug) + '.mp4';
    // The branded still we render alongside every video. Without it the player is
    // a black rectangle until the first frame decodes — and on iOS, until it plays.
    var poster = '/videos/' + encodeURIComponent(slug) + '-poster.jpg';
    fetch(src, { method: 'HEAD' })
      .then(function (r) {
        var slot = document.getElementById('cj-video');
        if (!r.ok || !slot) return;
        // Captions are a <track>, so they can be toggled and read by assistive
        // tech. WebVTT, not SRT — browsers don't accept SRT here. A conjecture
        // whose .vtt hasn't been generated simply shows no caption button.
        var vtt = '/videos/' + encodeURIComponent(slug) + '.vtt';
        slot.innerHTML =
          '<div class="video"><span class="k">Watch: what this conjecture is</span>' +
          '<video controls preload="metadata" playsinline poster="' + poster + '" src="' + src + '">' +
          '<track kind="captions" srclang="en" label="English" default src="' + vtt + '" />' +
          '</video></div>';
      })
      .catch(function () {});
  }

  // The open pool for this conjecture: what a volunteer's agent could claim right
  // now. Rendered only when something is actually open.
  // Short badge labels — the raw enum is too long for a phone-width row.
  var TK_LABEL = { counterexample_search: 'counterexample', computational: 'compute',
                   exploration: 'explore', lemma: 'lemma', formalization: 'proof' };

  function maybeAddTasks(slug) {
    fetch('/tasks/available?limit=12&slug=' + encodeURIComponent(slug), {
      headers: { accept: 'application/json' },
      cache: 'no-store',
    })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (list) {
        var slot = document.getElementById('cj-tasks');
        if (!slot || !list || !list.length) return;
        var h = '<div class="section-head feed-head"><span class="eyebrow">Open pool</span>' +
          '<h3>Work you could pick up.</h3></div><ul class="tasklist">';
        list.forEach(function (t) {
          var isVid = t.deliverable === 'explainer_video';
          h += '<li><span class="oc ' + (isVid ? 'tk--video' : 'tk--math') + '">' +
            (isVid ? 'video' : esc(TK_LABEL[t.kind] || String(t.kind).replace(/_/g, ' '))) + '</span>' +
            '<span class="tk-main"><span class="tk-t">' + esc(t.title) + '</span>' +
            (t.angle ? '<span class="tk-a">' + esc(t.angle) + '</span>' : '') + '</span>' +
            '<span class="tk-cap">up to $' + (t.max_cost_cents / 100).toFixed(2) + '</span></li>';
        });
        // The moment of motivation: someone reading THIS conjecture gets the
        // command that points their runner at it, not at the general pool.
        h += '</ul><p class="tk-note">Point your agent here with <span class="mono">npx givework run --watch --target ' + esc(slug) + '</span> · <a href="/tasks">see all open work →</a></p>';
        slot.innerHTML = h;
      })
      .catch(function () {});
  }

  // no-store: never let the browser serve the same-URL cached HTML page back to
  // this JSON request (content negotiation shares the URL).
  fetch('/conjectures/' + encodeURIComponent(slug), { headers: { accept: 'application/json' }, cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      render(d);
      if (window.posthog) posthog.capture('conjecture_viewed', { slug: slug, name: d.name, status: d.status });
    })
    .catch(function (e) {
      page.innerHTML = String(e.message) === '404'
        ? '<p class="board-msg">No conjecture called <span class="mono">' + esc(slug) + '</span>. <a href="/conjectures">Back to the board →</a></p>'
        : '<p class="board-msg">Couldn’t load this conjecture. The raw feed is at <span class="mono">/conjectures/' + esc(slug) + '</span>.</p>';
    });
})();
</script>

</body>
</html>
